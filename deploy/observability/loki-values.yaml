# OFFLINE CANDIDATE. No tenant endpoint, collectors or actual S3 binding.
fullnameOverride: obs-loki
deploymentMode: Monolithic
defaults:
  automountServiceAccountToken: false
serviceAccount:
  automountServiceAccountToken: false
gateway:
  enabled: false
ingress:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
singleBinary:
  replicas: 1
  sidecar: false
  resources:
    requests: {cpu: 250m, memory: 512Mi, ephemeral-storage: 128Mi}
    limits: {cpu: '1', memory: 2Gi, ephemeral-storage: 256Mi}
  extraArgs: [-config.expand-env=true]
  extraEnvFrom:
    - secretRef:
        name: obs-loki-s3-unconfigured
        optional: false
  persistence:
    enabled: true
    size: 20Gi
    storageClass: webdock-obs-storage-unqualified
    enableStatefulSetAutoDeletePVC: false
    whenDeleted: Retain
    whenScaled: Retain
backend: {replicas: 0}
read: {replicas: 0}
write: {replicas: 0}
ingester: {replicas: 0}
querier: {replicas: 0}
queryFrontend: {replicas: 0}
queryScheduler: {replicas: 0}
distributor: {replicas: 0}
compactor: {replicas: 0}
indexGateway: {replicas: 0}
bloomPlanner: {replicas: 0}
bloomBuilder: {replicas: 0}
bloomGateway: {replicas: 0}
loki:
  image:
    digest: sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
  auth_enabled: true
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: '2026-10-30'
        store: tsdb
        object_store: s3
        schema: v13
        index: {prefix: loki_index_, period: 24h}
  storage:
    type: s3
    bucketNames:
      chunks: ${OBS_LOKI_CHUNKS_BUCKET}
      ruler: ${OBS_LOKI_RULER_BUCKET}
    s3:
      endpoint: ${OBS_S3_ENDPOINT}
      region: ${OBS_S3_REGION}
      accessKeyId: ${OBS_S3_ACCESS_KEY_ID}
      secretAccessKey: ${OBS_S3_SECRET_ACCESS_KEY}
      s3ForcePathStyle: true
      insecure: false
  ingester:
    wal:
      enabled: true
      dir: /var/loki/wal
      replay_memory_ceiling: 512MB
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    retention_delete_delay: 2h
    retention_delete_worker_count: 2
    delete_request_store: s3
  limits_config:
    retention_period: 336h
    allow_structured_metadata: true
    ingestion_rate_mb: 2
    ingestion_burst_size_mb: 4
    per_stream_rate_limit: 512KB
    per_stream_rate_limit_burst: 1MB
    max_global_streams_per_user: 1000
    max_line_size: 64KB
    max_label_names_per_series: 15
    max_query_parallelism: 2
    max_query_series: 500
    max_query_length: 336h
    query_timeout: 30s
    reject_old_samples: true
    reject_old_samples_max_age: 24h
  query_range:
    cache_results: false
