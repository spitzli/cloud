apiVersion: batch/v1
kind: Job
metadata:
  name: buildkit-qualification
  namespace: webdock-builds
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    spec:
      serviceAccountName: webdock-build-job
      automountServiceAccountToken: false
      activeDeadlineSeconds: 180
      restartPolicy: Never
      containers:
      - name: buildkit
        image: docker.io/moby/buildkit:v0.34.1-rootless@sha256:f68752a5a94acfcdad2d07867b7075601a421638e17fc5f28efc1c814d0c4f89
        command:
        - sh
        - -ec
        args:
        - 'mkdir -p /tmp/context; printf "FROM scratch\nCOPY hello /hello\n" > /tmp/context/Dockerfile;
          printf "webdock qualification\n" > /tmp/context/hello; buildctl-daemonless.sh
          build --frontend dockerfile.v0 --local context=/tmp/context --local dockerfile=/tmp/context
          --output type=oci,dest=/tmp/image.tar; test -s /tmp/image.tar; echo "PASS:
          rootless BuildKit OCI export without profile exceptions"'
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 1Gi
          limits:
            cpu: '2'
            memory: 2Gi
            ephemeral-storage: 4Gi
        env:
        - name: BUILDKITD_FLAGS
          value: --oci-worker-snapshotter=native
        - name: TMPDIR
          value: /tmp
        - name: XDG_RUNTIME_DIR
          value: /run/user/1000
        volumeMounts:
        - name: temp
          mountPath: /tmp
        - name: state
          mountPath: /home/user/.local/share/buildkit
        - name: runtime
          mountPath: /run/user/1000
      securityContext:
        fsGroup: 1000
      volumes:
      - name: temp
        emptyDir:
          sizeLimit: 1Gi
      - name: state
        emptyDir:
          sizeLimit: 2Gi
      - name: runtime
        emptyDir:
          sizeLimit: 64Mi
