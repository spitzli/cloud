# Owned Webdock package gateway. No TLS interception, authentication or payload cache.
http_port 10.83.0.1:3128
visible_hostname webdock-build-package-proxy
cache_effective_user proxy
cache_effective_group proxy
pid_filename /run/webdock-package-proxy/squid.pid
coredump_dir /run/webdock-package-proxy
pinger_enable off
netdb_filename none
hosts_file /etc/squid/webdock-package-proxy.hosts
dns_nameservers 127.0.0.53
positive_dns_ttl 60 seconds
negative_dns_ttl 5 seconds
acl build_pods src 10.84.0.0/16
acl tls_port port 443
acl package_hosts dstdomain -n "/etc/squid/webdock-package-hosts.allow"
acl blocked_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.88.99.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4
acl blocked_dst dst 213.136.65.22/32 79.143.177.157/32 169.58.95.66/32 167.86.75.144/32
acl blocked_dst dst ::1/128 fc00::/7 fe80::/10 ff00::/8
acl too_many maxconn 64
http_access deny !build_pods
http_access deny !CONNECT
http_access deny !tls_port
http_access deny !package_hosts
http_access deny blocked_dst
http_access deny too_many
http_access allow build_pods CONNECT tls_port package_hosts
http_access deny all
# All upstream IPv6 is denied again by the UID-specific kernel firewall.
tcp_outgoing_address 167.86.75.144
cache deny all
cache_mem 0 MB
maximum_object_size 0 KB
access_log none
cache_store_log none
cache_log /dev/null
logfile_rotate 0
log_mime_hdrs off
strip_query_terms on
debug_options ALL,0
request_header_max_size 16 KB
request_timeout 30 seconds
connect_timeout 10 seconds
read_timeout 300 seconds
client_lifetime 1800 seconds
shutdown_lifetime 1 seconds
forwarded_for delete
via off
