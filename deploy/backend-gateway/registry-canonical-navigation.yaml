# Platform-owned legacy registry ingress only. The marker avoids a proxy loop;
# it is not authentication and does not bypass the registry's own permissions.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: registry-canonical-navigation
  namespace: wd-104618288083894272
spec:
  redirectRegex:
    regex: '^https?://registry\.webdock\.dev(?::443)?/(.*)'
    replacement: 'https://registry.spitzli.cloud/${1}'
    permanent: false
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: registry-canonical-navigation
  namespace: wd-104618288083894272
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: 'Host(`registry.webdock.dev`) && (Method(`GET`) || Method(`HEAD`)) && !Header(`X-Spitzli-Registry-Proxy`, `canonical`) && !(Path(`/api`) || PathPrefix(`/api/`) || Path(`/mcp`) || PathPrefix(`/mcp/`) || Path(`/.well-known`) || PathPrefix(`/.well-known/`) || PathPrefix(`/assets/`) || Path(`/_app`) || PathPrefix(`/_app/`) || Path(`/s3`) || PathPrefix(`/s3/`) || Path(`/manifest.schema.json`) || Path(`/openapi.json`) || Path(`/openapi`) || PathPrefix(`/openapi/`) || Path(`/auth/me`) || PathPrefix(`/auth/me/`) || Path(`/auth/providers`) || PathPrefix(`/auth/providers/`) || Path(`/healthz`) || Path(`/uploads`) || PathPrefix(`/uploads/`) || Path(`/well-known`) || PathPrefix(`/well-known/`) || Path(`/oauth/token`) || Path(`/oauth/introspect`) || Path(`/oauth/revoke`))'
      priority: 1000
      middlewares:
        - name: registry-canonical-navigation
      services:
        - name: app-104651089088876544
          port: 3000
  tls:
    secretName: registry-tls
