[package]
name = "webdock-mail"
version = "0.3.0"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-only"
publish = false

[workspace]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
sha2 = "0.10"
rustls-pemfile = "2"
axum = "0.8"
tokio-stream = { version = "0.1", features = ["net"] }
webdock-mail-runtime = { path = "../../crates/mail-runtime" }
webdock-mail-protocol = { path = "../../crates/mail-protocol" }
webdock-mail-message = { path = "../../crates/mail-message" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
webdock-plugin-protocol = { path = "../../crates/plugin-protocol" }
webdock-plugin-runtime = { path = "../../crates/plugin-runtime" }
webdock-plugin-kit = { path = "../../crates/plugin-kit" }
tonic = { version = "0.14.6", features = ["transport"] }
ed25519-dalek = "2"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
hickory-resolver = "0.25"
rcgen = "0.14"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

# Mirrors the root workspace policy; checked by tools/quality.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
as_ptr_cast_mut = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
cast_lossless = "deny"
checked_conversions = "deny"
dbg_macro = "deny"
excessive_nesting = "deny"
exit = "deny"
fallible_impl_from = "deny"
implicit_clone = "deny"
let_underscore_future = "deny"
lossy_float_literal = "deny"
manual_assert = "deny"
manual_let_else = "deny"
match_wildcard_for_single_variants = "deny"
mem_forget = "deny"
mut_mut = "deny"
needless_continue = "deny"
needless_pass_by_ref_mut = "deny"
option_option = "deny"
rc_mutex = "deny"
redundant_else = "deny"
ref_option_ref = "deny"
todo = "deny"
unchecked_time_subtraction = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unnecessary_box_returns = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
unnested_or_patterns = "deny"
