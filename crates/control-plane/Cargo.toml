[package]
name = "spitzli-control-plane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "spitzli-control-plane"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
spitzli-export-protocol={path="../export-protocol"}
rmcp={version="=3.5.1",default-features=false,features=["server","transport-streamable-http-server"]}
spitzli-build={path="../build"}
spitzli-plugin-host={path="../plugin-host"}
spitzli-plugin-protocol={path="../plugin-protocol"}
spitzli-repository-protocol={path="../repository-protocol"}
ed25519-dalek="2"
hex="0.4"
getrandom="0.2"
rcgen = { version = "0.14", features = ["x509-parser"] }
x509-parser = "0.18"
spitzli-mail = { path = "../mail" }
spitzli-databases = { path = "../databases" }
spitzli-provider-connections = { path = "../provider-connections" }
sha2 = "0.10"
subtle = "2.6"
spitzli-core = { path = "../core" }
spitzli-identity = { path = "../identity" }
spitzli-registry = { path = "../registry" }
spitzli-persistence = { path = "../persistence" }
spitzli-ids = { path = "../ids" }
spitzli-oauth = { path = "../oauth" }
spitzli-browser-session = { path = "../browser-session" }
spitzli-access = { path = "../access" }
spitzli-hosting = { path = "../hosting" }
spitzli-agent-control = { path = "../agent-control" }
spitzli-agent-protocol = { path = "../agent-protocol" }
spitzli-plugin-runtime = { path = "../plugin-runtime" }
spitzli-plugin-http = { path = "../plugin-http" }
tonic = { version = "0.14.6", features = ["transport", "tls-ring"] }
rustix = { version = "1", features = ["process", "fs"] }
base64 = "0.22"
percent-encoding = "2"
sea-orm.workspace = true
axum.workspace = true
tower = { version = "0.5", features = ["util"] }
tokio.workspace = true
tokio-stream={version="0.1",features=["net"]}
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
url.workspace = true
uuid = { version = "1", features = ["v4"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "fs"] }
governor = "0.10.4"
clap = { version = "4", features = ["derive"] }

spitzli-plugin-kit = { path = "../plugin-kit" }

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
spitzli-agent = { path = "../agent", default-features = false, features = ["docker"] }
tokio-postgres = "0.7"
serde-saphyr = "0.0.29"
tempfile = "3"
spitzli-secrets = { path = "../secrets" }
http-body-util = "0.1"
totp-rs = { version = "=6.0.0", features = ["otpauth"] }

[lints]
workspace = true
