[package]
name = "spitzli-build"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["service"]
service = ["dep:spitzli-agent-protocol","dep:spitzli-export-protocol","dep:spitzli-browser-session","dep:sea-orm", "dep:tokio", "dep:spitzli-identity", "dep:spitzli-persistence", "dep:spitzli-hosting", "dep:hmac", "dep:subtle", "dep:oci-client", "dep:rustls", "dep:getrandom", "dep:base64", "dep:axum", "dep:reqwest", "dep:url", "dep:spitzli-repository-protocol", "dep:spitzli-plugin-host", "dep:spitzli-plugin-runtime", "dep:tonic", "dep:uuid"]
worker = ["dep:tokio", "dep:reqwest", "dep:url", "dep:oci-client", "dep:rustls", "dep:base64"]
kubernetes-job = ["dep:kube", "dep:k8s-openapi", "dep:futures-util", "dep:tokio", "dep:spitzli-agent-protocol"]
local-registry-test = ["service", "worker"]

[dependencies]
spitzli-agent-protocol={path="../agent-protocol",optional=true}
spitzli-export-protocol={path="../export-protocol",optional=true}
spitzli-browser-session={path="../browser-session",optional=true}
spitzli-object-storage = { path = "../object-storage" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2 = "0.10"
hex = "0.4"
tar = "0.4"
tempfile = "3"
libc = "0.2"
sea-orm = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
spitzli-identity = { path = "../identity", optional = true }
spitzli-persistence = { path = "../persistence", optional = true }
spitzli-hosting = { path = "../hosting", optional = true }
hmac = { version = "0.12", optional = true }
chrono.workspace = true
subtle = { version = "2.6", optional = true }

axum = { workspace = true, optional = true }
reqwest = { version="0.13", default-features=false, features=["json","rustls-no-provider","stream"], optional=true }
url = { workspace=true, optional=true }
getrandom = { version="0.2", optional=true }
base64 = { version="0.22", optional=true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
oci-client = { version = "0.18", default-features = false, features = ["rustls-tls-no-provider"], optional = true }

spitzli-repository-protocol={path="../repository-protocol",optional=true}
spitzli-plugin-host={path="../plugin-host",optional=true}
spitzli-plugin-runtime={path="../plugin-runtime",optional=true}
ed25519-dalek="2"
tonic={version="0.14.6",default-features=false,features=["codegen","transport","tls-ring"],optional=true}
uuid={version="1",features=["v4"],optional=true}
kube = { version = "4.2.0", optional = true, default-features = false, features = ["client", "rustls-tls", "ring"] }
k8s-openapi = { version = "0.28", optional = true, features = ["v1_32"] }
futures-util = { version = "0.3", optional = true, features = ["io"] }

[dev-dependencies]
jsonschema = { version = "0.59", default-features = false }
spitzli-object-storage = { path = "../object-storage", features = ["local-test"] }
url.workspace = true
spitzli-ids = { path = "../ids" }
tower = { version = "0.5", features = ["util"] }
http = "1"
http-body-util = "0.1"

[[bin]]
name="spitzli-build-worker"
path="src/bin/spitzli-build-worker.rs"
required-features=["worker"]

[[bin]]
name="spitzli-build-runner"
path="src/bin/spitzli-build-container-runner.rs"
required-features=["worker","kubernetes-job"]

[[bin]]
name="spitzli-kubernetes-build-worker"
path="src/bin/spitzli-kubernetes-build-worker.rs"
required-features=["worker","kubernetes-job"]

[lints]
workspace = true
